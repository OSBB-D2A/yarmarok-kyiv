name: "Ярмарки Києва — API, Waze та сповіщення"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "src/monitor_fairs.py"
      - "src/build_feed_fair.py"
      - "data/waze-location-mapping.json"
      - ".github/workflows/build-feed-fair.yml"

permissions:
  contents: write

concurrency:
  group: kyiv-fairs-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Отримати дані GIS API та оновити звіт
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Перевірити GIS API, сформувати feed та HTML-звіт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/monitor_fairs.py

      - name: Перевірити сформовані файли
        run: |
          test -s outpoot/fairs-report.html
          test -s outpoot/fairs-api.json
          python -m json.tool outpoot/fairs-api.json > /dev/null
          if test -f outpoot/feed_fair.json; then
            python -m json.tool outpoot/feed_fair.json > /dev/null
          fi

      - name: Зберегти оновлені дані
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outpoot/fairs-monitor-state.json
          if git diff --cached --quiet -- outpoot/fairs-monitor-state.json; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "Дані GIS API не змінилися; новий коміт не потрібен."
              exit 0
            fi
            echo "Запуск після зміни коду: зберігаємо змінені результати навіть без зміни API."
          fi
          git add outpoot/feed_fair.json outpoot/fairs-report.html outpoot/fairs-api.json
          if git diff --cached --quiet; then
            echo "Згенеровані файли не змінилися; новий коміт не потрібен."
            exit 0
          fi
          git commit -m "Update Kyiv fairs monitoring data"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
            else
              git rebase --abort || true
            fi

            echo "main змінився; повторно формую звіт (спроба $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            SKIP_TELEGRAM=1 python src/monitor_fairs.py
            python -m json.tool outpoot/fairs-api.json > /dev/null
            git add outpoot/fairs-monitor-state.json
            if git diff --cached --quiet -- outpoot/fairs-monitor-state.json; then
              echo "Актуальні дані GIS API вже є в main."
              exit 0
            fi
            git add outpoot/feed_fair.json outpoot/fairs-report.html outpoot/fairs-api.json
            git commit -m "Update Kyiv fairs monitoring data"
          done

          echo "Не вдалося оновити main після трьох спроб."
          exit 1
