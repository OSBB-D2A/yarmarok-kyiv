name: Build Waze location mapping JSON

on:
  push:
    branches: [main]
    paths:
      - "data/waze-location-mapping.json.gz"
      - ".github/workflows/build-waze-mapping.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand and validate JSON mapping
        run: |
          gzip -dc data/waze-location-mapping.json.gz > data/waze-location-mapping.json
          python -m json.tool data/waze-location-mapping.json > /dev/null
          python - <<'PY'
          import json
          with open("data/waze-location-mapping.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["record_count"] == len(data["records"])
          required = {"place", "description", "event", "hash", "DIRECTIONS"}
          assert all(required <= set(row) for row in data["records"])
          print(f"Validated {len(data['records'])} mapping records")
          PY

      - name: Commit expanded JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/waze-location-mapping.json
          if git diff --cached --quiet; then
            echo "Mapping JSON is already up to date."
          else
            git commit -m "Generate readable Waze location mapping JSON"
            git push
          fi
