name: Київ — тест API ярмарків

on:
  push:
    branches: [main]
    paths:
      - "src/import_fairs_api.py"
      - ".github/workflows/test-fairs-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import official GIS API records
        run: python src/import_fairs_api.py

      - name: Upload imported data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-fairs-api-test
          path: output/
          if-no-files-found: warn
          retention-days: 14
