name: "Київ — збір сезонних ярмарків"

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL новини Порталу Києва (необов'язково)"
        required: false
        type: string
        default: "https://kyivcity.gov.ua/news/tsogo_tizhnya_u_stolitsi_proydut_sezonni_yarmarki_perelik_lokatsiy_1053155/"

permissions:
  contents: read

jobs:
  collect:
    name: Отримати перелік ярмарків
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Зібрати перелік ярмарків
        env:
          FAIRS_URL: ${{ inputs.source_url }}
        run: python src/scrape_fairs.py

      - name: Завантажити результати
        if: always() && hashFiles('output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-fairs-data
          path: output/
          if-no-files-found: error
          retention-days: 14
